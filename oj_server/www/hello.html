  <h1>Hello 页</h1>
  <p class="lead">这是 <code>www/hello.html</code> —— 你没有为它写过一行 C++。</p>
  <p>它能被访问，只是因为路由只有一条规则：<code>/xxx</code> → <code>www/xxx</code>。所以<strong>加一个页面 = 往磁盘上放一个文件</strong>，不用碰代码、不用重编译。</p>
  <p class="note">不信？改这个文件一个字，刷新立刻变。</p>
